default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: insta_clone_development
  username: <%= ENV.fetch("INSTA_DB_USER", "postgres") %>
  password: <%= ENV.fetch("INSTA_DB_PASSWORD", "") %>
  host: <%= ENV.fetch("INSTA_DB_HOST", "localhost") %>
  port: <%= ENV.fetch("INSTA_DB_PORT", 5432) %>

test:
  <<: *default
  database: insta_clone_test
  username: <%= ENV.fetch("INSTA_DB_USER", "postgres") %>
  password: <%= ENV.fetch("INSTA_DB_PASSWORD", "") %>
  host: <%= ENV.fetch("INSTA_DB_HOST", "localhost") %>
  port: <%= ENV.fetch("INSTA_DB_PORT", 5432) %>

staging:
  <<: *default
  database: <%= ENV['INSTA_DB_NAME'] %>
  username: <%= ENV['INSTA_DB_USER'] %>
  password: <%= ENV['INSTA_DB_PASSWORD'] %>
  host: <%= ENV['INSTA_DB_HOST'] %>
  port: <%= ENV['INSTA_DB_PORT'] %>

production:
  <<: *default
  database: <%= ENV['INSTA_DB_NAME'] %>
  username: <%= ENV['INSTA_DB_USER'] %>
  password: <%= ENV['INSTA_DB_PASSWORD'] %>
  host: <%= ENV['INSTA_DB_HOST'] %>
  port: <%= ENV['INSTA_DB_PORT'] %>
